[project]
name = "FireSat_Mock"
version = "2025.0.0"
requires-python = ">=3.10"
authors = [
    {name = "Jonathan Boyle", email = "tbd@mail.com"}
]
maintainers = [
    {name = "Jonathan Boyle", email = "tbd@mail.com"}
]
description = "Mock FireSat package for testing purposes."
readme = "README.md"
keywords = ["FireSat", "mock", "testing"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
package-dir = {"" = "src/firesat"}

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "info"
testpaths = [
  "src/tests",
]

[tool.coverage.run]
omit = ["src/tests/*"]

# [tool.black]
# line-length = 250

[tool.ruff]
line-length = 250
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"

# Currently, flake8 doesn't support metadata configuration in pyproject.toml, so this is symbolic
# Actual metadata config is held within the setup.cfg file
[tool.flake8]
max-line-length = 250
exclude = ".venv, .pytest_cache"
