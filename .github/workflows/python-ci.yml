name: Python CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install pre-commit & run linters
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --from-ref $(git merge-base ${{ github.event.pull_request.base.ref }}) --to-ref HEAD

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v3

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # cache: 'pip'
          # cache-dependency-path: requirements.txt

      - name: Install tox & Poetry
        run: |
          python -m pip install --upgrade pip
          pip install tox poetry

      - name: Run tox
        run: tox

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          tox
      - name: Analyze Code Coverage
        run: |
          pytest -v --cov --cov-fail-under=60 src/tests/
